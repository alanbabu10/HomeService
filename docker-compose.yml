version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: homeservice_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: homeservice_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/homeservice
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: homeservice_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
